function applyReverseChanges(word) {
    const results = new Set();
    const queue = [
        {
            word: word,
            usedRules: new Set()
        }
    ];
    while (queue.length > 0) {
        const current = queue.shift();
        const candidate = current.word;
        const usedRules = current.usedRules;
        results.add(candidate);

        for (let ruleIndex = 0;
             ruleIndex < soundChanges.length;
             ruleIndex++) {
            const rule = soundChanges[ruleIndex];

            if (rule.from === rule.to) {
                continue;
            }
               
            if (usedRules.has(ruleIndex)) {
                continue;
            }

            if (rule.to === "") {
                if (rule.position === "initial") {
                    const reversed =
                        rule.from + candidate;
                    if (!results.has(reversed)) {
                        const newUsedRules =
                            new Set(usedRules);
                        newUsedRules.add(ruleIndex);
                        queue.push({
                            word: reversed,
                            usedRules: newUsedRules
                        });
                    }
                }
                continue;
            }

            let index =
                candidate.indexOf(rule.to);
            while (index !== -1) {
                const reversed =
                    candidate.slice(0, index) +
                    rule.from +
                    candidate.slice(
                        index + rule.to.length
                    );
                if (!results.has(reversed)) {
                    const newUsedRules =
                        new Set(usedRules);
                    newUsedRules.add(ruleIndex);
                    queue.push({
                        word: reversed,
                        usedRules: newUsedRules
                    });
                }
                index =
                    candidate.indexOf(
                        rule.to,
                        index + rule.to.length
                    );
            }
        }
    }
    return [...results];
}

function generateCandidates() {
    const input =
        document
            .getElementById("modernInput")
            .value
            .trim();
    const result =
        document.getElementById("result");
    if (!input) {
        result.textContent =
            "現代音を入力してください";
        return;
    }
    const candidates =
        applyReverseChanges(input);

    const filtered =
        candidates.filter(
            candidate => candidate !== input
        );

    const unique =
        [...new Set(filtered)];

    if (unique.length === 0) {
        result.textContent =
            "候補が見つかりませんでした";
        return;
    }
    result.innerHTML =
        unique
            .map(
                candidate =>
                    `<span class="candidate">/${candidate}/</span>`
            )
            .join(" ");
}
