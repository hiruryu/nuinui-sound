function getReverseCandidates(text) {
    const memo = new Map();

    function solve(position) {
        if (position === text.length) {
            return [""];
        }

        if (memo.has(position)) {
            return memo.get(position);
        }

        const candidates = new Set();

        for (let end = position + 1; end <= text.length; end++) {
            const part = text.slice(position, end);

            const reverseParts = new Set([part]);

            for (const rule of soundChanges) {
                if (rule.from === rule.to) {
                    continue;
                }

                if (rule.to === "" && rule.position === "initial") {
                    if (position === 0) {
                        reverseParts.add(rule.from + part);
                    }
                    continue;
                }

                if (rule.to === "") {
                    continue;
                }

if (rule.to === part) {
    if (rule.position === "final" && end !== text.length) {
        continue;
    }

    if (rule.position === "initial" && position !== 0) {
        continue;
    }

    reverseParts.add(rule.from);
}
            }

            const restCandidates = solve(end);

            for (const reversePart of reverseParts) {
                for (const rest of restCandidates) {
                    candidates.add(reversePart + rest);
                }
            }
        }

        memo.set(position, [...candidates]);
        return memo.get(position);
    }

    return solve(0);
}

function generateCandidates() {
    const input = document.getElementById("modernInput").value.trim();
    const result = document.getElementById("result");

    if (!input) {
        result.textContent = "現代音を入力してください";
        return;
    }

    const candidates = getReverseCandidates(input)
        .filter(candidate => candidate !== input);

    if (candidates.length === 0) {
        result.textContent = "候補が見つかりませんでした";
        return;
    }

    result.innerHTML = candidates
        .map(candidate =>
            `<span class="candidate">/${candidate}/</span>`
        )
        .join(" ");

    result.innerHTML +=
        `<div style="margin-top:15px;font-size:14px;">
            ${candidates.length} 件
        </div>`;
}
