        function getReverseCandidates(text) {
            const memo = new Map();

            function solve(position) {
                if (position === text.length) {
                    return [""];
                }

                if (memo.has(position)) {
                    return memo.get(position);
                }

                const candidates = new Set();

                for (let end = position + 1; end <= text.length; end++) {
                    const part = text.slice(position, end);
                    const reverseParts = new Set();

                    for (const rule of soundChanges) {
                        if (rule.to === "") {
                            if (rule.position === "initial") {
                                if (position === 0 && /^[aeiou]/.test(part)) {
                                    reverseParts.add(rule.from + part);
                                }
                            }

                            if (rule.position === "final") {
                                if (end === text.length) {
                                    reverseParts.add(part + rule.from);
                                }
                            }

                            continue;
                        }

                        if (rule.to !== part) {
                            continue;
                        }

                        if (rule.position === "initial" && position !== 0) {
                            continue;
                        }

                        if (rule.position === "final" && end !== text.length) {
                            continue;
                        }

                        reverseParts.add(rule.from);
                    }

                    if (reverseParts.size === 0) {
                        continue;
                    }

                    const restCandidates = solve(end);

                    for (const reversePart of reverseParts) {
                        for (const rest of restCandidates) {
                            candidates.add(reversePart + rest);
                        }
                    }
                }

                memo.set(position, [...candidates]);
                return memo.get(position);
            }

            return solve(0);
        }

            const result = document.getElementById("result");

            if (!input) {
                result.textContent = "現代音を入力してください";
                return;
            }

            const candidates = getReverseCandidates(input)
                .filter(candidate => candidate !== input);

            if (candidates.length === 0) {
                result.textContent = "候補が見つかりませんでした";
                return;
            }

            result.innerHTML = candidates
                .map(candidate =>
                    `<span class="candidate">/${candidate}/</span>`
                )
                .join(" ");

            result.innerHTML +=
                `<div style="margin-top:15px;font-size:14px;">
            ${candidates.length} 件
        </div>`;
        }

        function getForwardCandidates(text) {
            const memo = new Map();

            function solve(position) {
                if (position === text.length) {
                    return [{ text: "", parts: 0 }];
                }

                if (memo.has(position)) {
                    return memo.get(position);
                }

                const candidates = [];

                for (let end = position + 1; end <= text.length; end++) {
                    const part = text.slice(position, end);

                    for (const rule of soundChanges) {
                        if (rule.from === "") {
                            continue;
                        }

                        if (rule.from !== part) {
                            continue;
                        }

                        if (rule.position === "initial" && position !== 0) {
                            continue;
                        }

                        if (rule.position === "final" && end !== text.length) {
                            continue;
                        }

                        const restCandidates = solve(end);

                        for (const rest of restCandidates) {
                            candidates.push({
                                text: rule.to + rest.text,
                                parts: rest.parts + 1
                            });
                        }
                    }
                }

                candidates.sort((a, b) => {
                    if (a.parts !== b.parts) {
                        return a.parts - b.parts;
                    }

                    if (a.text.length !== b.text.length) {
                        return a.text.length - b.text.length;
                    }

                    return a.text.localeCompare(b.text);
                });

                const unique = new Map();

                for (const candidate of candidates) {
                    if (!unique.has(candidate.text)) {
                        unique.set(candidate.text, candidate);
                    }
                }

                const result = [...unique.values()];

                memo.set(position, result);
                return result;
            }

            return solve(0).map(candidate => candidate.text);
        }

        function generateModernCandidates() {
            const input = document.getElementById("middleInput").value.trim();
            const result = document.getElementById("modernResult");

            if (!input) {
                result.textContent = "中古音を入力してください";
                return;
            }

            const candidates = getForwardCandidates(input);

            if (candidates.length === 0) {
                result.textContent = "候補が見つかりませんでした";
                return;
            }

            result.innerHTML = candidates
                .map(candidate =>
                    `<span class="candidate">/${candidate}/</span>`
                )
                .join(" ");

            result.innerHTML +=
                `<div style="margin-top:15px;font-size:14px;">
            ${candidates.length} 件
        </div>`;
        }
    </script>
